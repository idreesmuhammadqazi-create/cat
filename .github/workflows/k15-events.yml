name: k15 events
on:
  push:
    branches: [k15-events]
jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: collect
        run: |
          mkdir -p out
          curl -sS -H "Accept: application/vnd.github+json" "https://api.github.com/repos/FileSherlock/k15/events?per_page=100" -o out/repo-events.json || true
          curl -sS -H "Accept: application/vnd.github+json" "https://api.github.com/users/FileSherlock/events/public?per_page=100" -o out/user-events.json || true
          curl -sS -H "Accept: application/vnd.github+json" "https://api.github.com/repos/FileSherlock/k15/issues/1/timeline?per_page=100" -o out/timeline.json || true
          curl -sS -H "Accept: application/vnd.github+json" "https://api.github.com/repos/FileSherlock/k15/branches?per_page=100" -o out/branches.json || true
          curl -sS -H "Accept: application/vnd.github+json" "https://api.github.com/repos/FileSherlock/k15/commits?per_page=100" -o out/commits.json || true
          wc -c out/*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k15-events
          path: out
          retention-days: 7
