name: k15 sid
on:
  push:
    branches: [k15-sid]
jobs:
  sid:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: python3 tools/sid_probe.py > out.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k15-sid
          path: out.json
          retention-days: 7
