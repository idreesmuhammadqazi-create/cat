name: k15 sid
on:
  push:
    branches: [k15-sid]
jobs:
  sid:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          python3 tools/sid_probe.py > out.json
          python3 - <<'PY'
import json
j=json.load(open('out.json'))
print('runs',len(j),'hits',[x for x in j if x.get('hits')][:3],'errors',sum(1 for x in j if 'error' in x))
PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k15-sid
          path: out.json
          retention-days: 7
