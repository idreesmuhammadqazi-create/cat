name: k15 events2
on:
  push:
    branches: [k15-events2]
jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: collect
        run: |
          mkdir -p out
          for p in 1 2 3; do
            curl -sS -H "Accept: application/vnd.github+json" "https://api.github.com/repos/FileSherlock/k15/events?per_page=100&page=$p" -o out/repo-p$p.json || true
            curl -sS -H "Accept: application/vnd.github+json" "https://api.github.com/users/FileSherlock/events/public?per_page=100&page=$p" -o out/user-p$p.json || true
          done
          wc -c out/*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k15-events2
          path: out
          retention-days: 7
